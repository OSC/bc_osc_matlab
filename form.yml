---
cluster:
  - "pitzer"
  - "ascend"
  - "cardinal"
form:
  - auto_modules_matlab
  - auto_accounts
  - job_type
  - enable_mem
  - bc_num_nodes
  - num_cores
  - mem
  - bc_num_hours
  - gpus
  - gpu_type
  - bc_vnc_resolution
  - bc_email_on_started
attributes:
  auto_modules_matlab:
    default: false
  bc_vnc_resolution:
    required: true
  num_cores:
    label: "Number of cores per node"
    widget: number_field
  gpus:
    label: "GPUs"
    widget: number_field
  enable_mem:
    label: "Set memory"
    widget: check_box
    html_options:
      data:
        hide-mem-when-checked: false
  mem:
    label: "Memory in GB"
    widget: number_field
    hide_by_default: true
  job_type:
    label: "Job type"
    widget: select
    options:
    - - "CPU"
      - cpu-batch
      - data-hide-auto-modules-cuda: true
      - data-set-auto-modules-cuda: ''
      - data-set-enable-mem: 0
      - data-hide-mem: true
      - data-hide-gpu-type: true
      - data-hide-gpus: true
      - data-set-bc-num-nodes: 1
      - data-min-bc-num-nodes: 1
      - data-max-bc-num-nodes-for-cluster-cardinal: 12
      - data-max-bc-num-nodes-for-cluster-ascend: 16
      - data-max-bc-num-nodes-for-cluster-pitzer: 36
      - data-set-num-cores: 1
      - data-min-num-cores: 1
      - data-max-num-cores-for-cluster-cardinal: 96
      - data-max-num-cores-for-cluster-ascend: 118
      - data-max-num-cores-for-cluster-pitzer: 48
      - data-set-gpus: 0
      - data-min-gpus: 0
      - data-set-mem: 4
      - data-min-mem: 4
      - data-max-mem-for-cluster-cardinal: 1860   # hugemem
      - data-max-mem-for-cluster-ascend: 921      # quad
      - data-max-mem-for-cluster-pitzer: 2988     # hugemem
    - - "GPU"
      - gpu-batch
      - data-hide-auto-modules-cuda: false
      - data-set-enable-mem: 0
      - data-hide-mem: true
      - data-hide-gpu-type: false
      - data-hide-gpus: false
      - data-set-bc-num-nodes: 1
      - data-min-bc-num-nodes: 1
      - data-max-bc-num-nodes-for-cluster-cardinal: 12
      - data-max-bc-num-nodes-for-cluster-ascend: 16
      - data-max-bc-num-nodes-for-cluster-pitzer: 6
      - data-set-num-cores: 1
      - data-min-num-cores: 1
      - data-max-num-cores-for-cluster-cardinal: 96
      - data-max-num-cores-for-cluster-ascend: 120
      - data-max-num-cores-for-cluster-pitzer: 48
      - data-set-gpus: 1
      - data-min-gpus: 1
      - data-max-gpus-for-cluster-cardinal: 4
      - data-max-gpus-for-cluster-ascend: 4
      - data-max-gpus-for-cluster-pitzer: 2
      - data-set-mem: 4
      - data-min-mem: 4
      - data-max-mem-for-cluster-cardinal: 864   # gpu
      - data-max-mem-for-cluster-ascend: 921     # quad
      - data-max-mem-for-cluster-pitzer: 363     # gpu, gpu-exp
  gpu_type:
    label: "GPU types"
    widget: select
    options:
    - - "H100 94GB"
      - cardinal-gpu
      - data-option-for-cluster-cardinal: true
      - data-option-for-cluster-ascend: false
      - data-option-for-cluster-pitzer: false
      - data-set-bc-num-nodes: 1
      - data-min-bc-num-nodes: 1
      - data-max-bc-num-nodes: 12
      - data-set-num-cores: 1
      - data-min-num-cores: 1
      - data-max-num-cores: 96
      - data-set-gpus: 1
      - data-min-gpus: 1
      - data-max-gpus: 4
      - data-set-mem: 4
      - data-min-mem: 4
      - data-max-mem: 864
    - - "Any GPU"
      - ascend-batch
      - data-option-for-cluster-cardinal: false
      - data-option-for-cluster-ascend: true
      - data-option-for-cluster-pitzer: false
      - data-set-bc-num-nodes: 1
      - data-min-bc-num-nodes: 1
      - data-max-bc-num-nodes: 16
      - data-set-num-cores: 1
      - data-min-num-cores: 1
      - data-max-num-cores: 120
      - data-set-gpus: 1
      - data-min-gpus: 1
      - data-max-gpus: 4
      - data-set-mem: 4
      - data-min-mem: 4
      - data-max-mem: 921
    - - "A100 40GB"
      - ascend-nextgen
      - data-option-for-cluster-cardinal: false
      - data-option-for-cluster-ascend: true
      - data-option-for-cluster-pitzer: false
      - data-set-bc-num-nodes: 1
      - data-min-bc-num-nodes: 1
      - data-max-bc-num-nodes: 16
      - data-set-num-cores: 1
      - data-min-num-cores: 1
      - data-max-num-cores: 120
      - data-set-gpus: 1
      - data-min-gpus: 1
      - data-max-gpus: 3
      - data-set-mem: 4
      - data-min-mem: 4
      - data-max-mem: 472
    - - "A100 80GB"
      - ascend-quad
      - data-option-for-cluster-cardinal: false
      - data-option-for-cluster-ascend: true
      - data-option-for-cluster-pitzer: false
      - data-set-bc-num-nodes: 1
      - data-min-bc-num-nodes: 1
      - data-max-bc-num-nodes: 4
      - data-set-num-cores: 1
      - data-min-num-cores: 1
      - data-max-num-cores: 88
      - data-set-gpus: 1
      - data-min-gpus: 1
      - data-max-gpus: 4
      - data-set-mem: 4
      - data-min-mem: 4
      - data-max-mem: 921
    - - "Any GPU"
      - pitzer-batch
      - data-option-for-cluster-cardinal: false
      - data-option-for-cluster-ascend: false
      - data-option-for-cluster-pitzer: true
      - data-set-bc-num-nodes: 1
      - data-min-bc-num-nodes: 1
      - data-max-bc-num-nodes: 6
      - data-set-num-cores: 1
      - data-min-num-cores: 1
      - data-max-num-cores: 48
      - data-set-gpus: 1
      - data-min-gpus: 1
      - data-max-gpus: 4
      - data-set-mem: 4
      - data-min-mem: 4
      - data-max-mem: 744
    - - "V100 16GB"
      - pitzer-gpu
      - data-option-for-cluster-cardinal: false
      - data-option-for-cluster-ascend: false
      - data-option-for-cluster-pitzer: true
      - data-set-bc-num-nodes: 1
      - data-min-bc-num-nodes: 1
      - data-max-bc-num-nodes: 4
      - data-set-num-cores: 1
      - data-min-num-cores: 1
      - data-max-num-cores: 40
