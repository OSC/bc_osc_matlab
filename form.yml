---
cluster:
  - "pitzer"
  - "ascend"
  - "cardinal"
form:
  - auto_modules_matlab
  - auto_accounts
  - job_type
  - enable_mem
  - bc_num_slots
  - num_cores
  - mem
  - bc_num_hours
  - gpus
  - gpu_type
  - bc_vnc_resolution
  - bc_email_on_started
attributes:
  auto_modules_matlab:
    default: false
  bc_vnc_resolution:
    required: true
  num_cores:
    label: "Number of cores per node"
    widget: number_field
  gpus:
    label: "GPUs"
    widget: number_field
  gpu_type:
    label: "GPU types"
    widget: select
    options:
    - - "H100 94GB"
      - cardinal-gpu
      - data-option-for-cluster-cardinal: true
      - data-option-for-cluster-ascend: false
      - data-option-for-cluster-pitzer: false
      - data-set-gpus: 1
      - data-min-gpus: 1
      - data-max-gpus: 4
      - data-set-mem: 4
      - data-min-mem: 4
      - data-max-mem: 472
      - data-set-bc-num-slots: 1
      - data-min-bc-num-slots: 1
      - data-max-bc-num-slots: 12
      - data-set-num-cores: 1
      - data-min-num-cores: 1
      - data-max-num-cores: 96
    - - "A100 40GB"
      - ascend-nextgen
      - data-option-for-cluster-cardinal: false
      - data-option-for-cluster-ascend: true
      - data-option-for-cluster-pitzer: false
      - data-set-gpus: 1
      - data-min-gpus: 1
      - data-max-gpus: 2
      - data-set-mem: 4
      - data-min-mem: 4
      - data-max-mem: 472
      - data-set-bc-num-slots: 1
      - data-min-bc-num-slots: 1
      - data-max-bc-num-slots: 16
      - data-set-num-cores: 1
      - data-min-num-cores: 1
      - data-max-num-cores: 88
    - - "A100 80GB"
      - ascend-quad
      - data-option-for-cluster-cardinal: false
      - data-option-for-cluster-ascend: true
      - data-option-for-cluster-pitzer: false
      - data-set-gpus: 1
      - data-min-gpus: 1
      - data-max-gpus: 4
      - data-set-mem: 4
      - data-min-mem: 4
      - data-max-mem: 920
      - data-set-bc-num-slots: 1
      - data-min-bc-num-slots: 1
      - data-max-bc-num-slots: 4
      - data-set-num-cores: 1
      - data-min-num-cores: 1
      - data-max-num-cores: 40
    - - "V100 16GB"
      - pitzer-gpu
      - data-option-for-cluster-cardinal: false
      - data-option-for-cluster-ascend: false
      - data-option-for-cluster-pitzer: true
      - data-set-gpus: 1
      - data-min-gpus: 1
      - data-max-gpus: 2
      - data-set-mem: 4
      - data-min-mem: 4
      - data-max-mem: 384
      - data-set-bc-num-slots: 1
      - data-min-bc-num-slots: 1
      - data-max-bc-num-slots: 4
      - data-set-num-cores: 1
      - data-min-num-cores: 1
      - data-max-num-cores: 96
    - - "V100 32GB"
      - pitzer-gpu-exp
      - data-option-for-cluster-cardinal: false
      - data-option-for-cluster-ascend: false
      - data-option-for-cluster-pitzer: true
      - data-set-gpus: 1
      - data-min-gpus: 1
      - data-max-gpus: 2
      - data-set-mem: 4
      - data-min-mem: 4
      - data-max-mem: 384
      - data-set-bc-num-slots: 1
      - data-min-bc-num-slots: 1
      - data-max-bc-num-slots: 6
      - data-set-num-cores: 1
      - data-min-num-cores: 1
      - data-max-num-cores: 48
    - - "V100s 32GB (NVLink)"
      - pitzer-gpu-quad
      - data-option-for-cluster-cardinal: false
      - data-option-for-cluster-ascend: false
      - data-option-for-cluster-pitzer: true
      - data-set-gpus: 1
      - data-min-gpus: 1
      - data-max-gpus: 4
      - data-set-mem: 4
      - data-min-mem: 4
      - data-max-mem: 768
      - data-set-bc-num-slots: 1
      - data-min-bc-num-slots: 1
      - data-max-bc-num-slots: 1
      - data-set-num-cores: 1
      - data-min-num-cores: 1
      - data-max-num-cores: 48
  enable_mem:
    label: "Use memory instead of cores"
    widget: check_box
    html_options:
      data:
        hide-num-cores-when-checked: true
        hide-mem-when-checked: false
  mem:
    label: "Memory per node"
    widget: number_field
    hide_by_default: true
  job_type:
    label: "Job type"
    widget: select
    options:
    - - cpu
      - cpu-batch
      - data-hide-auto-modules-cuda: true
      - data-set-auto-modules-cuda: ''
      - data-set-enable-mem: 0
      - data-hide-mem: true
      - data-hide-gpu-type: true
      - data-hide-gpus: true
      - data-set-gpus: 0
      - data-min-gpus: 0
      - data-set-num-cores: 1
      - data-min-num-cores: 1
      - data-max-num-cores-for-cluster-cardinal: 96
      - data-max-num-cores-for-cluster-ascend: 118
      - data-max-num-cores-for-cluster-pitzer: 48
      - data-set-bc-num-slots: 1
      - data-min-bc-num-slots: 1
      - data-max-num-slots-for-cluster-cardinal: 96
      - data-max-num-slots-or-cluster-ascend: 118
      - data-max-num-slots-for-cluster-pitzer: 48
      - data-set-mem: 4
      - data-min-mem: 4
      - data-max-bc-mem-for-cluster-cardinal: 1860
      - data-max-bc-mem-for-cluster-ascend: 920
      - data-max-bc-mem-for-cluster-pitzer: 2988
    - - gpu
      - gpu-batch
      - data-hide-auto-modules-cuda: false
      - data-set-enable-mem: 0
      - data-hide-mem: true
      - data-hide-gpu-type: false
      - data-hide-gpus: false
      - data-set-gpus: 1
      - data-min-gpus: 1
